name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: List files for debug
      run: ls -R

    - name: Build with Gradle
      run: |
        # Create a dummy .env with the required key to satisfy the secrets plugin
        echo "GEMINI_API_KEY=dummy" > .env
        
        # Generate debug.keystore if missing (it is gitignored)
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

        # Accept Android SDK licenses if sdkmanager is available
        yes | sdkmanager --licenses 2>/dev/null || true
        
        # Build the APK skipping linting to speed up and avoid minor failures
        gradle clean assembleDebug -x lint --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChefSync-v1.0-Debug
        path: app/build/outputs/apk/debug/*.apk
