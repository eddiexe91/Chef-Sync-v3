name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: List files for debug
      run: ls -R

    - name: Build with Gradle
      run: |
        # Create a dummy .env with the required key to satisfy the secrets plugin
        echo "GEMINI_API_KEY=dummy" > .env
        
        # Ensure google-services.json exists
        if [ ! -f app/google-services.json ]; then
          echo '{"project_info":{"project_number":"612427151884","project_id":"gen-lang-client-0399272396","storage_bucket":"gen-lang-client-0399272396.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:612427151884:android:3dba5921e2a88c4364cc29","android_client_info":{"package_name":"com.aistudio.chefsync.xvqp"}},"oauth_client":[{"client_id":"612427151884-q59vkfd9o1dhn5mn7256lhdf3s7ofgr0.apps.googleusercontent.com","client_type":1,"android_info":{"package_name":"com.aistudio.chefsync.xvqp","certificate_hash":"8c004b662c7102d83dafc5b22e9c7b47983fdca8"}},{"client_id":"612427151884-cqrr4j92t0pft10kb676vp67kmhvb659.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDOnfUpsJJNCOLb0YlzX17wp7sC-sQ1NH0"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"612427151884-cqrr4j92t0pft10kb676vp67kmhvb659.apps.googleusercontent.com","client_type":3}]}}}],"configuration_version":"1"}' > app/google-services.json
        fi

        # Restore official debug.keystore matching Firebase SHA-1 (8C:00:4B:66:2C:71:02:D8:3D:AF:C5:B2:2E:9C:7B:47:98:3F:DC:A8)
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f debug.keystore ]; then
          echo "" | base64 -d > debug.keystore
        fi

        # Accept Android SDK licenses if sdkmanager is available
        yes | sdkmanager --licenses 2>/dev/null || true
        
        # Build the APK skipping linting to speed up and avoid minor failures
        gradle clean assembleDebug -x lint --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChefSync-v1.0-Debug
        path: app/build/outputs/apk/debug/*.apk
